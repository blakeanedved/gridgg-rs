[package]
name = "gridgg"
version = "0.1.0"
edition = "2024"
authors = ["Blake Nedved <blakeanedved@gmail.com>"]
description = "A Rust library for working with grids."
license = "MIT-0"
repository = "https://github.com/blakeanedved/gridgg-rs"
documentation = "https://docs.rs/gridgg"
readme = "README.md"
keywords = ["grid"]
categories = ["data-structures"]
include = ["/src", "/README.md", "/LICENSE*"]

[lib]
name = "gridgg"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[package.metadata.docs.rs]
all-features = true
