# GRID Live Data Feed — Series Events API (AsyncAPI 3.0)
asyncapi: 3.0.0
info:
  title: GRID Live Data Feed — Series Events API
  version: 1.0.0
  description: 'WebSocket feed that pushes Transactions (each containing one or more Events) as they occur during a live series.
    Generated from the GRID Data Portal API Reference (2026-11-12).


    Connection limits (per API key): connection attempts per minute and simultaneous connections are capped (GRID''s docs
    give the defaults only as placeholders); a connection is closed automatically 24 hours after the last activity — any Data
    or Control frame from either side resets the timer, so send periodic WebSocket Ping frames to keep idle connections open.
    All connections must use wss://.


    Reverted events: any event can be reverted (e.g. admin reset). A reverted event has the same structure, but its action
    is prefixed with ''!'' (e.g. type `player-!killed-player`, action `!killed`), `revertedEventId` points at the original
    event, and delta values are the inverse of the original (e.g. a kill count of -1 instead of +1).


    State objects (`seriesState`, `seriesStateDelta`, entity `state`/`stateDelta`) follow the Series State API GraphQL model
    (see series-state.graphql). States nest: Series → Games → Segments (e.g. round) → Segments (e.g. buy phase) …'
servers:
  production:
    host: api.grid.gg
    protocol: wss
    description: GRID Live Data Feed
    security:
    - $ref: '#/components/securitySchemes/apiKeyQuery'
channels:
  seriesEvents:
    address: /live-data-feed/series/{seriesId}
    description: 'Series Events stream for one series. Example: wss://api.grid.gg/live-data-feed/series/1?key=<API_KEY>'
    parameters:
      seriesId:
        description: GRID Series ID (from the Central Data Feed).
    messages:
      transaction:
        $ref: '#/components/messages/Transaction'
operations:
  receiveTransactions:
    action: receive
    channel:
      $ref: '#/channels/seriesEvents'
    summary: Receive transactions for a series, in order.
    messages:
    - $ref: '#/channels/seriesEvents/messages/transaction'
components:
  securitySchemes:
    apiKeyQuery:
      type: httpApiKey
      name: key
      in: query
      description: Personal GRID API key passed as the `key` query parameter.
  messages:
    Transaction:
      name: Transaction
      contentType: application/json
      summary: A single package of data sent over the WebSocket; all included events are processed together in order.
      payload:
        $ref: '#/components/schemas/Transaction'
  schemas:
    Transaction:
      type: object
      description: Metadata plus an ordered array of events.
      required:
      - id
      - occurredAt
      - publishedAt
      - seriesId
      - sequenceNumber
      - events
      properties:
        id:
          type: string
          description: Unique ID of the transaction
        correlationId:
          type: string
          description: Internal reference for troubleshooting
        occurredAt:
          type: string
          description: ISO 8601 timestamp when the transaction occurred
          format: date-time
        publishedAt:
          type: string
          description: ISO 8601 timestamp when the transaction was published to the WebSocket
          format: date-time
        seriesId:
          type: string
          description: ID of the series
        sequenceNumber:
          type: integer
          description: Order of the transaction in the feed for the series (may skip if filtered)
        sessionSequenceNumber:
          type: integer
          description: Order of the transaction in the context of the current consumer session
        events:
          type: array
          description: Array of one or more event objects
          minItems: 1
          items:
            $ref: '#/components/schemas/Event'
    Event:
      type: object
      description: A single, discrete change or action within the series.
      required:
      - id
      - type
      - actor
      - action
      - target
      properties:
        id:
          type: string
          description: Unique ID of the event
        type:
          type: string
          description: Event type '{actor}-{action}-{target}'. See EventType for the documented values; reverted events use
            '!' before the action (e.g. 'player-!killed-player'). Treat unknown values as forward-compatible.
          examples:
          - player-killed-player
          - player-!killed-player
        includesFullState:
          type: boolean
          description: Whether the event includes the full state (based on configuration)
        actor:
          $ref: '#/components/schemas/Entity'
        action:
          type: string
          description: The action performed (e.g. 'killed', 'planted'); prefixed with '!' for reverted events
        target:
          $ref: '#/components/schemas/Entity'
        seriesStateDelta:
          type: object
          description: Fields that changed at the series level as a result of this event (Series State model)
        seriesState:
          type: object
          description: Complete series state after the event, if included (Series State model)
        revertedEventId:
          type: string
          description: ID of the event this event reverts; only present on reverted events
    Entity:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          description: Type of the entity (e.g. player, team, game)
        id:
          type: string
          description: Unique series-level entity ID
        stateDelta:
          type: object
          description: Fields changed at the entity level
        state:
          type: object
          description: Entity state after the event
    EventType:
      type: string
      description: Documented event types (non-reverted form). See x-grid-event-types for actor/action/target/titles of each.
      enum:
      - grid-started-feed
      - grid-ended-feed
      - grid-invalidated-series
      - grid-validated-series
      - tournament-started-series
      - tournament-ended-series
      - series-started-game
      - series-ended-game
      - team-won-game
      - team-won-series
      - player-killed-player
      - player-teamkilled-player
